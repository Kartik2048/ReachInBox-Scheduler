version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reachinbox-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reachinbox
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reachinbox']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reachinbox-network

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reachinbox-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  reachinbox-network:
    driver: bridge
